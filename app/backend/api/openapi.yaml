openapi: 3.0.3
info:
  title: Avitosha API
  version: 2.0.0
  description: Gamification layer that turns useful Avito actions into Avitosha progress.
servers:
  - url: http://localhost:8080

tags:
  - name: health
  - name: auth
  - name: game
  - name: realtime
  - name: marketplace

paths:
  /api/v1/listing-categories:
    get:
      tags: [marketplace]
      operationId: listListingCategories
      summary: List public marketplace categories
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingCategoryResponse'
  /api/v1/listings:
    get:
      tags: [marketplace]
      operationId: listListings
      summary: List public published listings
      description: This read-only catalog is available to guests.
      parameters:
        - $ref: '#/components/parameters/ListingCategory'
        - $ref: '#/components/parameters/ListingQuery'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Published listings page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
    post:
      tags: [marketplace]
      operationId: createListing
      summary: Create a private listing draft
      description: Requires authentication. Creating a draft does not generate a game effect.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingWriteRequest' }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
  /api/v1/listings/{listing_id}:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    get:
      tags: [marketplace]
      operationId: getListing
      summary: Get a public published listing
      description: Read-only; viewing does not mutate state. Authenticated clients register a view separately.
      responses:
        '200': { description: Listing, content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [marketplace]
      operationId: updateListing
      summary: Edit own listing
      description: Requires authentication. `eventId` makes the request idempotent. A published listing earns LISTING_IMPROVED only when it closes a previously unawarded quality criterion.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ListingUpdateRequest' } } }
      responses:
        '200': { description: Updated listing and optional game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/listings/{listing_id}/publish:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    post:
      tags: [marketplace]
      operationId: publishListing
      summary: Publish own quality-complete listing
      description: Requires a non-empty title and price greater than zero. A photo URL and description of at least 150 characters improve listing quality but do not block publication. The server calculates AD_CREATED and game effects; client provides only eventId.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventRequest' } } } }
      responses:
        '200': { description: Published listing and game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/listings/{listing_id}/unpublish:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    post:
      tags: [marketplace]
      operationId: unpublishListing
      summary: Remove own listing from public catalog
      description: No game effects are generated in this stage.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      responses:
        '200': { description: Unpublished listing, content: { application/json: { schema: { $ref: '#/components/schemas/Listing' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/listings:
    get:
      tags: [marketplace]
      operationId: listMyListings
      summary: List authenticated user's listings
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageOffset' } ]
      responses:
        '200': { description: Own listings, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } }
  /api/v1/uploads/listing-photos:
    post:
      tags: [marketplace]
      operationId: createListingPhotoUpload
      summary: Create a signed MinIO upload form
      description: Requires authentication. The returned fields are sent directly to the self-hosted S3-compatible MinIO storage as multipart/form-data; append the file field last. The form accepts one JPEG, PNG or WebP file within the configured size limit.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUploadRequest' }
      responses:
        '201': { description: Signed upload form, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoUploadForm' } } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/InternalError' }
  /api/v1/listings/{listing_id}/favorite:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    put:
      tags: [marketplace]
      operationId: addFavorite
      summary: Add another user's public listing to favorites
      description: "eventId is idempotent. A newly created favorite generates AD_FAVORITED server-side."
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventRequest' } } } }
      responses: { '200': { description: Favorite state and game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } } }
    delete:
      tags: [marketplace]
      operationId: removeFavorite
      summary: Remove listing from favorites
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      responses: { '200': { description: Favorite state, content: { application/json: { schema: { $ref: '#/components/schemas/FavoriteMutation' } } } } }
  /api/v1/me/favorites:
    get:
      tags: [marketplace]
      operationId: listFavorites
      summary: List authenticated user's favorites
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageOffset' } ]
      responses: { '200': { description: Favorite listings, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPage' } } } } }
  /api/v1/listings/{listing_id}/views:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    post:
      tags: [marketplace]
      operationId: registerListingView
      summary: Register an authenticated unique listing view
      description: A user can have one counted view of a listing per UTC day. GET remains read-only. A counted view generates AD_VIEWED server-side.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EventRequest' } } } }
      responses: { '200': { description: View registration and game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } } }
  /api/v1/listings/{listing_id}/messages:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    get:
      tags: [marketplace]
      operationId: listListingMessages
      summary: List messages visible to the authenticated user
      description: Returns an empty list when the user has not started a conversation. Existing messages remain visible only to their participants.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      responses: { '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/ListingMessagesResponse' } } } } }
    post:
      tags: [marketplace]
      operationId: contactSeller
      summary: Send the first message to a listing seller
      description: Repeating the action returns the first stored message. The first contact generates MESSAGE_SENT server-side.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactSellerRequest' } } } }
      responses: { '201': { description: First-contact result and game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } } }
  /api/v1/listings/{listing_id}/purchase:
    parameters: [ { $ref: '#/components/parameters/ListingID' } ]
    post:
      tags: [marketplace]
      operationId: purchaseListing
      summary: Purchase another user's published listing
      description: A regular listing becomes sold after purchase. A demo listing remains public and can be purchased once per authenticated buyer. The server generates LISTING_SOLD and, when deliveryUsed is true, DELIVERY_USED in one transaction.
      security: [ { bearerAuth: [] }, { userIdHeader: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseListingRequest' } } } }
      responses:
        '201': { description: Completed demo deal and game feedback, content: { application/json: { schema: { $ref: '#/components/schemas/MarketplaceActionResponse' } } } }
        '409':
          description: The demo purchase was already completed, the listing is unavailable, or eventId conflicts with another action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                demoPurchaseAlreadyCompleted:
                  value: { error: { code: demo_purchase_already_completed, message: This demo purchase has already been completed } }
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      responses:
        '200':
          description: Process is alive
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      responses:
        '200':
          description: Process is alive
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      responses:
        '200':
          description: PostgreSQL is reachable
        '503':
          $ref: '#/components/responses/InternalError'

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '201':
          description: User and session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      responses:
        '200':
          description: Access and refresh tokens rotated
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
        '401':
          description: Refresh cookie is missing or the session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_refresh_cookie:
                  value:
                    error:
                      code: unauthorized
                      message: Authentication is required
                expired_session:
                  value:
                    error:
                      code: session_expired
                      message: Session has expired or is no longer valid
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me:
    get:
      tags: [auth]
      operationId: me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pet:
    get:
      tags: [game]
      operationId: getPet
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Avitosha profile created during user registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [game]
      operationId: renamePet
      summary: Rename the current user's pet
      description: The name is normalized and must contain only Russian letters, single spaces, or hyphens. Offensive names are rejected.
      security:
        - bearerAuth: []
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePetRequest'
      responses:
        '200':
          description: Updated Avitosha profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetProfile'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/tasks:
    get:
      tags: [game]
      operationId: listTasks
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Assigned tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskProgress'
  /api/v1/tasks/{task_id}:
    get:
      tags: [game]
      operationId: getTask
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskProgress'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{task_id}/advice:
    get:
      tags: [game]
      operationId: getTaskAdvice
      summary: Get a short personalized Avitosha tip for a task
      description: Uses the configured ProxyAPI model when available and returns a deterministic safe fallback otherwise. This endpoint never changes progress, rewards, or balances.
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Personalized or fallback task advice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAdvice'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/actions:
    post:
      tags: [game]
      operationId: processAction
      security:
        - bearerAuth: []
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '200':
          description: Atomic action result; duplicate is true for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/room:
    get:
      tags: [game]
      operationId: getRoom
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Room catalog with LOCKED/PLACED state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
  /api/v1/story:
    get:
      tags: [game]
      operationId: getStory
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: FIRST_ROOM progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryResponse'
  /api/v1/daily-summary:
    get:
      tags: [game]
      operationId: getDailySummary
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Current UTC-day summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'
  /api/v1/leaderboard:
    get:
      tags: [game]
      operationId: getLeaderboard
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [weekly]
            default: weekly
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Weekly top and current user position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/achievements:
    get:
      tags: [game]
      operationId: getAchievements
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Achievement catalog and unlock state
          content:
            application/json:
              schema:
                type: object
                required: [achievements]
                properties:
                  achievements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Achievement'
  /api/v1/rewards/balance:
    get:
      tags: [game]
      operationId: getRewardBalances
      summary: Get the current user's reward balances
      description: Returns balances actually credited from tasks, daily goals, balanced-day bonuses and streak rewards. AVITO_BONUS is initialized with a zero balance during user registration.
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Current and lifetime reward totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardBalanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/rewards/wallet:
    get:
      tags: [game]
      operationId: getRewardWallet
      summary: Get the current user's reward wallet and perk roadmap
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Wallet balance, concrete perk catalog and the nearest unlock target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardWallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/ws:
    get:
      tags: [realtime]
      operationId: gameWebSocket
      description: WebSocket stream scoped to the authenticated user. Browser clients may pass access_token in the query string.
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  parameters:
    ListingID:
      name: listing_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListingCategory:
      name: category
      in: query
      schema: { type: string, example: FURNITURE }
    ListingQuery:
      name: query
      in: query
      schema: { type: string, maxLength: 120 }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Temporary mock integration boundary; the UUID must belong to an existing user.

  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    AuthCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    AuthResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    PetMood:
      type: string
      enum: [CALM, CURIOUS, HAPPY, EXCITED, PROUD, SLEEPING]
    PetCharacter:
      type: string
      enum: [EXPLORER, ENTREPRENEUR, MECHANIC, TRAVELER, ARCHITECT, CRAFTSPERSON]
    CharacterProfile:
      type: object
      required: [code, name, description, iconKey, visualDetail, progress, target, unlocked]
      properties:
        code:
          $ref: '#/components/schemas/PetCharacter'
        name:
          type: string
        description:
          type: string
        iconKey:
          type: string
        visualDetail:
          type: string
        progress:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 1
        unlocked:
          type: boolean
    CurrentStory:
      type: object
      required: [code, title, currentStage, totalStages, status]
      properties:
        code:
          type: string
        title:
          type: string
        currentStage:
          type: integer
        totalStages:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED]
    PetProfile:
      type: object
      required: [id, name, level, growthXp, mood, characterProfile, currentStory]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^[А-Яа-яЁё]+(?:[ -][А-Яа-яЁё]+)*$'
        level:
          type: integer
          minimum: 1
          maximum: 5
        growthXp:
          type: integer
          minimum: 0
        nextLevelXp:
          type: integer
          nullable: true
        mood:
          $ref: '#/components/schemas/PetMood'
        character:
          allOf:
            - $ref: '#/components/schemas/PetCharacter'
          nullable: true
        characterProfile:
          $ref: '#/components/schemas/CharacterProfile'
        currentStory:
          $ref: '#/components/schemas/CurrentStory'
    RenamePetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
          pattern: '^[А-Яа-яЁё]+(?:[ -][А-Яа-яЁё]+)*$'
          example: Мурзик
    ListingCategory:
      type: object
      required: [code, name, sortOrder]
      properties:
        code: { type: string, example: FURNITURE }
        name: { type: string, example: Мебель и интерьер }
        sortOrder: { type: integer, example: 1 }
    ListingCategoryResponse:
      type: object
      required: [categories]
      properties:
        categories: { type: array, items: { $ref: '#/components/schemas/ListingCategory' } }
    ListingStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED, SOLD]
    ListingQuality:
      type: object
      required: [score, isEligible, missingFields, nextActionHint]
      properties:
        score: { type: integer, minimum: 0, maximum: 3 }
        isEligible: { type: boolean, description: "True when the listing can be published (requires a price greater than zero)." }
        missingFields: { type: array, items: { type: string, enum: [price, photo, description] } }
        nextActionHint: { type: string }
    Listing:
      type: object
      required: [id, ownerId, categoryCode, title, description, priceKopecks, status, isDemo, photoUrls, quality]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        categoryCode: { type: string }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        priceKopecks: { type: integer, format: int64, minimum: 0, example: 249000 }
        status: { $ref: '#/components/schemas/ListingStatus' }
        isDemo: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        soldAt: { type: string, format: date-time, nullable: true }
        photoUrls: { type: array, maxItems: 10, items: { type: string, format: uri } }
        quality: { $ref: '#/components/schemas/ListingQuality' }
    ListingWriteRequest:
      type: object
      additionalProperties: false
      required: [categoryCode, title, description, priceKopecks, photoUrls]
      properties:
        categoryCode: { type: string, example: FURNITURE }
        title: { type: string, minLength: 1, maxLength: 120, example: Настольная лампа }
        description: { type: string, maxLength: 5000 }
        priceKopecks: { type: integer, format: int64, minimum: 0 }
        photoUrls: { type: array, maxItems: 10, items: { type: string, format: uri } }
        eventId: { type: string, format: uuid }
    PhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, size]
      properties:
        fileName: { type: string, minLength: 1, example: sofa.jpg }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, minimum: 1, example: 524288 }
    PhotoUploadForm:
      type: object
      required: [url, fields, publicUrl, objectKey, expiresAt, maxFileSize]
      properties:
        url: { type: string, format: uri-reference, example: '/storage/avitosha-photos' }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Signed multipart fields. Send every field unchanged and append the binary `file` part last.
        publicUrl: { type: string, format: uri-reference }
        objectKey: { type: string, example: 'listing-photos/user-id/object-id.jpg' }
        expiresAt: { type: string, format: date-time }
        maxFileSize: { type: integer, format: int64 }
    ListingUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ListingWriteRequest'
        - type: object
          required: [eventId]
    ListingPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Listing' } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }
    FavoriteMutation:
      type: object
      required: [favorite]
      properties:
        favorite: { type: boolean }
        created: { type: boolean }
        removed: { type: boolean }
    ViewRegistration:
      type: object
      required: [counted]
      properties:
        counted: { type: boolean }
    ContactSellerRequest:
      type: object
      additionalProperties: false
      required: [body, eventId]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        eventId: { type: string, format: uuid }
    ListingMessage:
      type: object
      required: [id, listingId, senderId, recipientId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ContactSellerResponse:
      type: object
      required: [message, first]
      properties:
        message: { $ref: '#/components/schemas/ListingMessage' }
        first: { type: boolean }
    ListingMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/ListingMessage' } }
    PurchaseListingRequest:
      type: object
      additionalProperties: false
      required: [deliveryUsed, eventId]
      properties:
        deliveryUsed: { type: boolean }
        eventId: { type: string, format: uuid }
    EventRequest:
      type: object
      additionalProperties: false
      required: [eventId]
      properties:
        eventId: { type: string, format: uuid }
    MarketplaceActionResponse:
      type: object
      properties:
        listing: { $ref: '#/components/schemas/Listing' }
        deal: { $ref: '#/components/schemas/ListingDeal' }
        message: { $ref: '#/components/schemas/ListingMessage' }
        favorite: { type: boolean }
        counted: { type: boolean }
        first: { type: boolean }
        actionResult: { $ref: '#/components/schemas/ActionResult' }
    ListingDeal:
      type: object
      required: [id, listingId, buyerId, sellerId, deliveryUsed, completedAt]
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        buyerId: { type: string, format: uuid }
        sellerId: { type: string, format: uuid }
        deliveryUsed: { type: boolean }
        completedAt: { type: string, format: date-time }

    ActionType:
      type: string
      enum: [AD_VIEWED, AD_FAVORITED, MESSAGE_SENT, AD_CREATED, DELIVERY_USED, REVIEW_LEFT, BOOKING_CREATED, LISTING_IMPROVED, LISTING_SOLD]
    TaskProgress:
      type: object
      required: [id, code, title, description, petPhrase, actionType, progress, target, status, xpReward, avitoRewardAmount]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: string
        petPhrase:
          type: string
        actionType:
          $ref: '#/components/schemas/ActionType'
        category:
          type: string
          nullable: true
        progress:
          type: integer
        target:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED, REWARDED, EXPIRED]
        xpReward:
          type: integer
        roomItemCode:
          type: string
          nullable: true
        avitoRewardType:
          type: string
          nullable: true
        avitoRewardAmount:
          type: integer
        storyStage:
          type: integer
          nullable: true
    TaskAdvice:
      type: object
      additionalProperties: false
      required: [taskId, text, generatedByAi]
      properties:
        taskId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 220
          example: Сравни фотографии, состояние товара и условия доставки.
        generatedByAi:
          type: boolean
          description: True when ProxyAPI returned a valid Qwen response; false for the safe local fallback.
    ActionRequest:
      type: object
      additionalProperties: false
      required: [eventId, type, occurredAt, metadata]
      properties:
        eventId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActionType'
        entityId:
          type: string
        category:
          type: string
        occurredAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    DomainEvent:
      type: object
      required: [id, type, occurredAt]
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
    ActionResult:
      type: object
      required: [actionId, duplicate, events]
      properties:
        actionId:
          type: string
          format: uuid
        duplicate:
          type: boolean
        events:
          type: array
          items:
            $ref: '#/components/schemas/DomainEvent'
    RoomItem:
      type: object
      required: [code, name, description, status, assetKey, positionKey]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [LOCKED, UNLOCKED, PLACED]
        assetKey:
          type: string
        positionKey:
          type: string
        unlockTaskCode:
          type: string
          nullable: true
    RoomResponse:
      type: object
      required: [storyCode, progress, items]
      properties:
        storyCode:
          type: string
        progress:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoomItem'
    StoryResponse:
      type: object
      required: [code, title, description, currentStage, totalStages, status]
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        currentStage:
          type: integer
        totalStages:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED]
        nextTask:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            title:
              type: string
            roomItemCode:
              type: string
              nullable: true
    DailySummary:
      type: object
      required: [date, actionsCount, completedTasks, earnedXp, levelBefore, levelAfter, unlockedRoomItems, storyStageBefore, storyStageAfter, weeklyScoreDelta, petMood, retention]
      properties:
        date:
          type: string
          format: date
        actionsCount:
          type: integer
        completedTasks:
          type: integer
        earnedXp:
          type: integer
        levelBefore:
          type: integer
        levelAfter:
          type: integer
        unlockedRoomItems:
          type: array
          items:
            type: string
        storyStageBefore:
          type: integer
        storyStageAfter:
          type: integer
        weeklyScoreDelta:
          type: integer
        weeklyPosition:
          type: integer
          nullable: true
        petMood:
          $ref: '#/components/schemas/PetMood'
        retention:
          $ref: '#/components/schemas/RetentionOverview'
    LeaderboardEntry:
      type: object
      required: [position, userId, petName, level, score, completedTasks]
      properties:
        position:
          type: integer
        userId:
          type: string
          format: uuid
        petName:
          type: string
        level:
          type: integer
        score:
          type: integer
        completedTasks:
          type: integer
    LeaderboardResponse:
      type: object
      required: [weekStart, leaders, currentUser]
      properties:
        weekStart:
          type: string
          format: date
        leaders:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        currentUser:
          $ref: '#/components/schemas/LeaderboardEntry'
    Achievement:
      type: object
      required: [code, title, description, iconKey, unlocked]
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        iconKey:
          type: string
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          format: date-time
          nullable: true
    RewardBalance:
      type: object
      required: [type, balance, earnedTotal, updatedAt]
      properties:
        type:
          type: string
          example: AVITO_BONUS
        balance:
          type: integer
          format: int64
          minimum: 0
        earnedTotal:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    RewardBalanceResponse:
      type: object
      required: [balances]
      properties:
        balances:
          type: array
          items:
            $ref: '#/components/schemas/RewardBalance'
    RewardOffer:
      type: object
      required: [type, amount, source]
      properties:
        type:
          type: string
        amount:
          type: integer
        source:
          type: string
          enum: [TASK_COMPLETION, DAILY_QUEST, DAILY_GOAL, BALANCED_DAY, STREAK]
    StreakOverview:
      type: object
      required: [current, longest, protections, activeToday, reward]
      properties:
        current:
          type: integer
        longest:
          type: integer
        protections:
          type: integer
          description: Number of one-day streak shields available.
        lastActiveDate:
          type: string
          format: date
          nullable: true
        activeToday:
          type: boolean
        reward:
          $ref: '#/components/schemas/RewardOffer'
    DailyQuest:
      type: object
      required: [date, code, title, description, actionType, role, progress, target, status, xpReward]
      properties:
        date:
          type: string
          format: date
        code:
          type: string
        title:
          type: string
        description:
          type: string
        actionType:
          type: string
          enum: [AD_VIEWED, AD_FAVORITED, MESSAGE_SENT, AD_CREATED, DELIVERY_USED, REVIEW_LEFT, BOOKING_CREATED, LISTING_IMPROVED, LISTING_SOLD]
        role:
          type: string
          enum: [BUYER, SELLER, UNIVERSAL]
        category:
          type: string
          nullable: true
        progress:
          type: integer
        target:
          type: integer
        status:
          type: string
          enum: [ACTIVE, COMPLETED, REWARDED, EXPIRED]
        xpReward:
          type: integer
    DailyGoal:
      type: object
      required: [date, quests, completed, required, status, xpReward, reward, balancedCompleted, balancedReward]
      properties:
        date:
          type: string
          format: date
        quests:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/DailyQuest'
        completed:
          type: integer
        required:
          type: integer
        status:
          type: string
          enum: [ACTIVE, REWARDED, EXPIRED]
        xpReward:
          type: integer
        reward:
          $ref: '#/components/schemas/RewardOffer'
        balancedCompleted:
          type: boolean
        balancedReward:
          $ref: '#/components/schemas/RewardOffer'
    RewardGoal:
      type: object
      required: [code, title, rewardType, perkType, current, target, remaining]
      properties:
        code:
          type: string
        title:
          type: string
        rewardType:
          type: string
        perkType:
          type: string
        current:
          type: integer
          format: int64
        target:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
    TomorrowPreview:
      type: object
      required: [date, streakAfterReturn, streakReward, tasksCount, required, buyerTasks, sellerTasks, universalTasks, xpReward, reward, balancedReward]
      properties:
        date:
          type: string
          format: date
        streakAfterReturn:
          type: integer
        streakReward:
          $ref: '#/components/schemas/RewardOffer'
        tasksCount:
          type: integer
        required:
          type: integer
        buyerTasks:
          type: integer
        sellerTasks:
          type: integer
        universalTasks:
          type: integer
        xpReward:
          type: integer
        reward:
          $ref: '#/components/schemas/RewardOffer'
        balancedReward:
          $ref: '#/components/schemas/RewardOffer'
        nextGoal:
          allOf:
            - $ref: '#/components/schemas/RewardGoal'
          nullable: true
    RetentionOverview:
      type: object
      required: [streak, dailyGoal, tomorrow]
      properties:
        streak:
          $ref: '#/components/schemas/StreakOverview'
        dailyGoal:
          $ref: '#/components/schemas/DailyGoal'
        tomorrow:
          $ref: '#/components/schemas/TomorrowPreview'
    RewardCatalogEntry:
      type: object
      required: [code, title, description, rewardType, perkType, threshold, unlocked, progressCurrent, progressTarget, remaining]
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        rewardType:
          type: string
        perkType:
          type: string
        threshold:
          type: integer
          format: int64
        unlocked:
          type: boolean
        progressCurrent:
          type: integer
          format: int64
        progressTarget:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
    RewardWallet:
      type: object
      required: [balance, catalog]
      properties:
        balance:
          $ref: '#/components/schemas/RewardBalance'
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/RewardCatalogEntry'
        nextGoal:
          allOf:
            - $ref: '#/components/schemas/RewardGoal'
          nullable: true

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - sqlclosecheck
    - revive
  settings:
    revive:
      confidence: 0.8
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
